name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override. Leave empty to use VERSION.'
        required: false
        default: ''
      version_postfix:
        description: 'Version postfix (e.g. -galidar)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

env:
  SOLUTION_FILE_PATH: ./intermediate/vs2022/ds3os.sln
  BUILD_CONFIGURATION: Release
  FLUTTER_VERSION: '3.27.x'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            POSTFIX=""
          else
            VERSION="${{ github.event.inputs.version }}"
            POSTFIX="${{ github.event.inputs.version_postfix }}"
          fi
          if [[ -z "${VERSION}" ]]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "Version is empty. Set VERSION or pass a workflow input." >&2
            exit 1
          fi
          FULL="${VERSION}${POSTFIX}"
          # .NET's AssemblyVersion / FileVersion attributes only
          # accept strict major[.minor[.build[.revision]]] — no
          # prerelease suffixes. Strip everything from the first
          # '-' onwards (so "2.8.0-experimental" → "2.8.0") and pad
          # to four parts so SemVer 3-part versions also pass.
          NUMERIC="${FULL%%-*}"
          while [[ $(echo "$NUMERIC" | tr -cd '.' | wc -c) -lt 3 ]]; do
            NUMERIC="${NUMERIC}.0"
          done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "postfix=${POSTFIX}" >> "$GITHUB_OUTPUT"
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "numeric=${NUMERIC}" >> "$GITHUB_OUTPUT"
          echo "tag=v${FULL}" >> "$GITHUB_OUTPUT"
          echo "asset_name=DSSeamlessCoop_V${FULL}.zip" >> "$GITHUB_OUTPUT"

      - name: Stamp Build Version
        shell: bash
        run: printf '%s\n' '${{ steps.version.outputs.full }}' > VERSION

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # ---- C++ (Server.exe + Injector.dll) ----
      - name: Generate Solution
        shell: cmd
        working-directory: ${{ github.workspace }}/Tools
        run: ${{ github.workspace }}/Tools/generate_vs2022.bat

      - name: Restore Dependencies
        working-directory: ${{ github.workspace }}
        run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }} /t:Restore

      - name: Build C++ (Server, Injector, …)
        working-directory: ${{ github.workspace }}
        run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }} /t:Build

      # ---- BonfireService (.NET 8 self-contained single-file) ----
      #
      # Version property accepts arbitrary semver (gets stored in
      # AssemblyInformationalVersion). FileVersion / AssemblyVersion
      # require strict numeric major.minor.build.revision per
      # CS7034 — the "numeric" output above strips '-experimental'
      # and pads to 4 parts.
      - name: Publish BonfireService
        run: >
          dotnet publish ./Source/BonfireService/BonfireService.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.full }}
          -p:FileVersion=${{ steps.version.outputs.numeric }}
          -p:AssemblyVersion=${{ steps.version.outputs.numeric }}
          -o ${{ github.workspace }}/Source/bonfire/build/bonfire_service/

      # ---- Bonfire (Flutter desktop) ----
      - name: Bonfire — pub get
        working-directory: ${{ github.workspace }}/Source/bonfire
        run: flutter pub get

      - name: Bonfire — build windows release
        working-directory: ${{ github.workspace }}/Source/bonfire
        run: flutter build windows --release

      # ---- Assemble release zip ----
      - name: Package Release
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: ${{ github.workspace }}/Tools/generate_package_windows.bat

      - name: Zip Release
        uses: vimtor/action-zip@v1.2
        with:
          files: DSSeamlessCoop/
          dest: ${{ steps.version.outputs.asset_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset_name }}
          path: ./${{ steps.version.outputs.asset_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Automated build from `${{ github.sha }}`.

            ## How to install
            1. Download `${{ steps.version.outputs.asset_name }}` below.
            2. Extract anywhere (e.g. `C:\DSSeamlessCoop\`).
            3. Run `Bonfire.exe` (accept the UAC prompt — admin is required for firewall and runtime preparation).
            4. Pick the **Dark Souls I**, **Dark Souls II**, or **Dark Souls III** tab → **+ New bonfire** → follow the firewall/runtime prompts → **Light the bonfire**.

            See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full setup details.
          draft: false
          prerelease: ${{ contains(steps.version.outputs.full, '-') }}
          files: ./${{ steps.version.outputs.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
