name: bonfire
description: Bonfire - Galidar's Dark Souls online server hub.
publish_to: 'none'
# Bonfire release version lives in ../../VERSION. The Windows runner stamps
# executable metadata from that file during CMake configure.
version: 0.0.0+0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State management - keep it lean (provider rather than riverpod for now).
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/banner.png
    - assets/brand/header_banner.png
    - assets/brand/logo.png
